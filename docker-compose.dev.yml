version: '3.8'

# Development docker-compose with volume mounts for hot reload

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qforia-backend-dev
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - qforia-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qforia-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - qforia-network

networks:
  qforia-network:
    driver: bridge

